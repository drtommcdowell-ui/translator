<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translator</title>
<style>
body{font-family:sans-serif;margin:12px;font-size:20px;background:#fff;color:#111}
h1{margin:4px 0 8px;font-size:28px}
button{font-size:20px;padding:12px;border-radius:10px;border:0;background:#1a73e8;color:#fff}
.big{width:100%;font-size:32px;padding:22px;margin:8px 0}
.stop{background:#c62828}
.row{display:flex;gap:8px;margin:8px 0}
.row button{flex:1;background:#e0e0e0;color:#111}
.row button.on{background:#1a73e8;color:#fff}
.small{font-size:16px;color:#555}
#status{font-size:18px;color:#1a237e;font-weight:bold}
#meter{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:6px 0}
#bar{height:100%;width:0;background:#2e7d32}
#captions{border:1px solid #ccc;border-radius:10px;min-height:160px;padding:10px;margin:8px 0;white-space:pre-wrap;font-size:22px}
#diag{font-size:14px;white-space:pre-wrap;background:#f5f5f5;padding:8px;border-radius:8px}
.hide{display:none}
input{font-size:18px;padding:8px;width:100%;box-sizing:border-box}
details{margin-top:14px}
</style>
</head>
<body>
<h1>Translator</h1>
<div id="status">Ready. Press Start.</div>
<button id="startBtn" class="big">Start</button>
<div id="meter"><div id="bar"></div></div>
<div class="small" id="micName">Mic: not started</div>

<div class="small">Microphone</div>
<div class="row"><button id="micEarbud">Earbud mic</button><button id="micPhone">Phone mic</button></div>
<div class="small">Partner</div>
<div class="row"><button id="pFemale">Female</button><button id="pMale">Male</button></div>

<div id="captions">Captions will appear here.</div>

<details><summary>Ear test</summary>
<p class="small">Left earbud = partner (Thai). Right earbud = you (English).</p>
<div class="row"><button id="testLeft" class="on">Beep LEFT</button><button id="testRight" class="on">Beep RIGHT</button></div>
</details>

<details><summary>Microphone list</summary>
<button id="listMics">Show microphones</button>
<div id="diag"></div>
</details>

<details><summary>API key</summary>
<div id="keyBox"><p class="small">Paste your Gemini API key:</p><input id="keyInput" type="password" autocomplete="off"><button id="saveKey" style="margin-top:8px">Save key</button></div>
<div id="keySaved" class="hide"><p class="small">Key saved on this device.</p><button id="changeKey" style="background:#777">Change key</button></div>
</details>
<p class="small">Version: file 5</p>

<script>
var $ = function(id){ return document.getElementById(id); };
function load(k,d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }
function setStatus(t){ $('status').textContent = t; }
var S = { mic: load('micChoice','phone'), partner: load('partner','female') };

var RULES_TH = "You are a live interpreter. Tom is a man who speaks English. Translate each English message from Tom into natural, friendly, polite everyday Central Thai.\n\nRules:\n1. Tom is male. Always use male forms: ผม for I/me, and end each reply with ครับ or นะครับ. Never use ฉัน, ดิฉัน, ค่ะ, คะ or นะคะ.\n2. This applies even when Tom talks about or quotes a woman. Tom is still the speaker, so the reply still ends with ครับ.\n3. Friendly and polite everyday Thai. No slang, no crude words, no royal or official vocabulary.\n4. Translate questions and requests. Never answer them and never add anything.\n5. Output only the Thai translation: no English, no romanization, no notes, no quotation marks.\n6. Keep names, numbers and places exactly as said.";
var RULES_EN = "You are a live interpreter. Tom's conversation partner speaks Central Thai to Tom. Translate each Thai message into natural, friendly, polite everyday English.\n\nRules:\n1. Translate questions and requests. Never answer them and never add anything.\n2. Output only the English translation: no Thai, no notes, no quotation marks.\n3. Keep names, numbers and places exactly as said.";
var API_URL = 'https://generativelanguage.googleapis.com/v1beta/interactions';
var PAUSE_MS = 4000, CHECK_MS = 700, TH = 0.02;
var END_RE = /[\s,\.]*(ten[\s\-\.:]*ten|10[\s\-\.:]*10|เท็น\s*เท็น|เทน\s*เทน)[\s\.\!\?,]*$/i;

function paintChoices(){
  $('micEarbud').classList.toggle('on', S.mic === 'earbud');
  $('micPhone').classList.toggle('on', S.mic === 'phone');
  $('pFemale').classList.toggle('on', S.partner === 'female');
  $('pMale').classList.toggle('on', S.partner === 'male');
}
$('micEarbud').onclick = function(){ S.mic = 'earbud'; save('micChoice','earbud'); paintChoices(); if (running) restartMic(); };
$('micPhone').onclick = function(){ S.mic = 'phone'; save('micChoice','phone'); paintChoices(); if (running) restartMic(); };
$('pFemale').onclick = function(){ S.partner = 'female'; save('partner','female'); paintChoices(); };
$('pMale').onclick = function(){ S.partner = 'male'; save('partner','male'); paintChoices(); };

function getKey(){ return load('geminiKey',''); }
function showKeyState(){ var k = getKey(); $('keyBox').classList.toggle('hide', !!k); $('keySaved').classList.toggle('hide', !k); }
$('saveKey').onclick = function(){ var v = $('keyInput').value.trim(); if (!v) { alert('Paste the key first.'); return; } save('geminiKey', v); $('keyInput').value = ''; showKeyState(); };
$('changeKey').onclick = function(){ try { localStorage.removeItem('geminiKey'); } catch(e) {} showKeyState(); };

var ctx = null;
function ensureCtx(){ if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); } if (ctx.state === 'suspended') { ctx.resume(); } return ctx; }
function beep(pan){
  var c = ensureCtx(); var t = c.currentTime + 0.05;
  var o = c.createOscillator(); var g = c.createGain(); var p = c.createStereoPanner();
  p.pan.value = pan; o.frequency.value = pan < 0 ? 440 : 880;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.05);
  g.gain.setValueAtTime(0.4, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  o.connect(g); g.connect(p); p.connect(c.destination); o.start(t); o.stop(t + 0.85);
}
$('testLeft').onclick = function(){ beep(-1); };
$('testRight').onclick = function(){ beep(1); };

var running = false, stream = null, raf = 0, analyser = null, srcNode = null, wakeLock = null;
var rec = null, heardSpeech = false, voicedFrames = 0, lastVoice = 0, segStart = 0;
var queue = Promise.resolve(), turns = [], playing = false, currentSource = null;
var checking = false, lastCheck = 0;

async function listInputs(){
  var devs = await navigator.mediaDevices.enumerateDevices();
  return devs.filter(function(d){ return d.kind === 'audioinput'; });
}
function pickDevice(inputs){
  var bt = /bluetooth|headset|hands|hfp|sco|xg99|\bbt\b/i;
  if (S.mic === 'earbud') { return inputs.find(function(d){ return bt.test(d.label); }) || null; }
  return inputs.find(function(d){ return !bt.test(d.label) && d.deviceId !== 'default' && d.deviceId !== 'communications'; }) || null;
}
async function openMic(){
  var tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
  var inputs = await listInputs();
  tmp.getTracks().forEach(function(t){ t.stop(); });
  var dev = pickDevice(inputs);
  var note = (S.mic === 'earbud' && !dev) ? ' (earbud mic not found, using default)' : '';
  var a = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  if (dev) { a.deviceId = { exact: dev.deviceId }; }
  stream = await navigator.mediaDevices.getUserMedia({ audio: a });
  var c = ensureCtx();
  srcNode = c.createMediaStreamSource(stream);
  analyser = c.createAnalyser(); analyser.fftSize = 1024;
  srcNode.connect(analyser);
  $('micName').textContent = 'Mic: ' + (stream.getAudioTracks()[0].label || 'unnamed') + note;
  meterLoop();
}
function closeMic(){
  cancelAnimationFrame(raf); raf = 0;
  if (srcNode) { try { srcNode.disconnect(); } catch(e) {} srcNode = null; }
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  $('bar').style.width = '0';
}
function stopRecorderSilently(){ if (rec) { var r = rec; rec = null; r.onstop = null; try { r.stop(); } catch(e) {} } }
async function restartMic(){
  stopRecorderSilently(); closeMic();
  try { await openMic(); if (running && !playing) startRecorder(); } catch(e) { setStatus('Mic error: ' + e.message); }
}

function startRecorder(){
  var mt = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' : '';
  var r = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream);
  r._chunks = [];
  r.ondataavailable = function(e){ if (e.data && e.data.size) r._chunks.push(e.data); };
  r.start();
  rec = r; heardSpeech = false; voicedFrames = 0; segStart = Date.now(); lastVoice = 0; lastCheck = 0;
}
function endSegment(send){
  var r = rec; if (!r) return; rec = null;
  var had = heardSpeech && voicedFrames >= 10;
  r.onstop = function(){
    if (send && had) {
      var type = (r.mimeType || 'audio/webm').split(';')[0];
      enqueueAudio(new Blob(r._chunks, { type: type }), type);
    }
  };
  try { r.stop(); } catch(e) {}
  if (running && !playing) startRecorder();
}

async function checkPartial(){
  var r = rec; if (!r) return;
  checking = true; lastCheck = Date.now();
  try {
    await new Promise(function(res){
      var done = false; var h = function(){ if (!done) { done = true; res(); } };
      r.addEventListener('dataavailable', h, { once: true });
      try { r.requestData(); } catch(e) { h(); }
      setTimeout(h, 400);
    });
    if (rec !== r) return;
    var type = (r.mimeType || 'audio/webm').split(';')[0];
    var text = await transcribe(new Blob(r._chunks.slice(), { type: type }), type);
    if (rec !== r || !running) return;
    if (END_RE.test(text)) {
      rec = null; r.onstop = null; try { r.stop(); } catch(e) {}
      if (running && !playing) startRecorder();
      setStatus('Translating...');
      enqueueText(text.replace(END_RE, '').trim());
    }
  } catch(e) {
  } finally {
    checking = false;
  }
}

function meterLoop(){
  var buf = new Float32Array(analyser.fftSize);
  (function tick(){
    analyser.getFloatTimeDomainData(buf);
    var s = 0; for (var i = 0; i < buf.length; i++) { s += buf[i] * buf[i]; }
    var rms = Math.sqrt(s / buf.length);
    $('bar').style.width = Math.min(100, Math.round(rms * 400)) + '%';
    if (running && rec && !playing) {
      var now = Date.now();
      if (rms > TH) {
        voicedFrames++; lastVoice = now;
        if (voicedFrames >= 10 && !heardSpeech) { heardSpeech = true; setStatus('Hearing speech...'); }
      } else if (heardSpeech && now - lastVoice > PAUSE_MS) {
        setStatus('Translating...'); endSegment(true);
      } else if (heardSpeech && !checking && now - lastVoice > CHECK_MS && now - lastCheck > 1500) {
        checkPartial();
      } else if (!heardSpeech && now - segStart > 30000) {
        endSegment(false);
      }
    }
    raf = requestAnimationFrame(tick);
  })();
}

function blobToBase64(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function extractText(j){
  if (j && typeof j.output_text === 'string') return j.output_text;
  var parts = [];
  ((j && j.steps) || []).forEach(function(s){
    (s.content || []).forEach(function(c){ if (c.type === 'text' && c.text) parts.push(c.text); });
  });
  return parts.join('\n');
}
function extractAudio(j){
  var d = '';
  ((j && j.steps) || []).forEach(function(s){
    (s.content || []).forEach(function(c){ if (c.type === 'audio' && c.data) d = c.data; });
  });
  if (!d && j && j.output_audio && j.output_audio.data) d = j.output_audio.data;
  return d;
}
async function postGemini(body){
  var r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': getKey() }, body: JSON.stringify(body) });
  var t = await r.text(); var j = null; try { j = JSON.parse(t); } catch(e) {}
  if (!r.ok) throw new Error('ERROR ' + r.status + ': ' + t.slice(0, 300));
  return j;
}
async function callGemini(body){ return extractText(await postGemini(body)).trim(); }
async function transcribe(blob, type){
  var b64 = await blobToBase64(blob);
  return callGemini({
    model: 'gemini-3.5-transcribe',
    input: [ { type: 'audio', data: b64, mime_type: type } ],
    generation_config: { transcription_config: { language_codes: ['en-US', 'th-TH'], mode: 'smart' } }
  });
}
async function speak(text, voice){
  var j = await postGemini({
    model: 'gemini-3.8-flash-tts',
    input: [ { type: 'user_input', content: [ { type: 'text', text: text, annotations: [ { type: 'speech_metadata', style: 'friendly and polite' } ] } ] } ],
    response_format: { type: 'audio' },
    generation_config: { speech_config: [ { voice: voice } ] }
  });
  var b64 = extractAudio(j);
  if (!b64) throw new Error('No audio returned.');
  return b64;
}
function playAudio(b64, pan){
  return new Promise(function(resolve){
    var c = ensureCtx();
    var bin = atob(b64); var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    c.decodeAudioData(bytes.buffer, function(buffer){
      if (!running) { resolve(); return; }
      stopRecorderSilently(); playing = true; setStatus('Speaking...');
      var src = c.createBufferSource(); src.buffer = buffer;
      var p = c.createStereoPanner(); p.pan.value = pan;
      src.connect(p); p.connect(c.destination);
      currentSource = src;
      src.onended = function(){
        currentSource = null; playing = false;
        if (running && stream && !rec) { startRecorder(); setStatus('Listening.'); }
        resolve();
      };
      src.start();
    }, function(){ setStatus('Could not play the audio.'); resolve(); });
  });
}
function enqueueAudio(blob, type){
  queue = queue.then(async function(){
    if (!getKey()) { setStatus('No API key saved.'); return; }
    var t = await transcribe(blob, type);
    await processText(t.replace(END_RE, '').trim());
  }).catch(function(e){ setStatus(e.message); });
}
function enqueueText(text){
  queue = queue.then(function(){ return processText(text); }).catch(function(e){ setStatus(e.message); });
}
async function processText(heard){
  if (!heard) { setStatus(running ? 'Listening.' : 'Stopped.'); return; }
  var isThai = /[\u0E00-\u0E7F]/.test(heard);
  var out = await callGemini({ model: 'gemini-3.5-flash-lite', system_instruction: isThai ? RULES_EN : RULES_TH, input: heard });
  if (!running || !out) return;
  addTurn(isThai ? 'partner' : 'you', heard, out);
  setStatus('Making the voice...');
  var voice = isThai ? (S.partner === 'male' ? 'Achird' : 'Sulafat') : 'Achird';
  var pan = isThai ? 1 : -1;
  var audio = await speak(out, voice);
  await playAudio(audio, pan);
}
function addTurn(who, heard, out){ turns.unshift({ who: who, heard: heard, out: out }); if (turns.length > 6) turns.pop(); renderCaptions(); }
function renderCaptions(){
  if (!turns.length) { $('captions').textContent = 'Captions will appear here.'; return; }
  $('captions').textContent = turns.map(function(t){
    return t.who === 'you' ? ('YOU: ' + t.heard + '\nTHAI: ' + t.out) : ('PARTNER: ' + t.heard + '\nENGLISH: ' + t.out);
  }).join('\n\n');
}

async function lockScreen(){
  try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } }
  catch(e) { setStatus('Screen-awake not available: ' + e.message); }
}
document.addEventListener('visibilitychange', function(){ if (running && document.visibilityState === 'visible') { lockScreen(); } });

$('startBtn').onclick = async function(){
  var btn = this;
  if (!running) {
    ensureCtx();
    try { await openMic(); } catch(e) { setStatus('Mic error: ' + e.message); return; }
    await lockScreen();
    running = true; playing = false; startRecorder();
    btn.textContent = 'Stop'; btn.classList.add('stop');
    setStatus('Listening.');
  } else {
    running = false; stopRecorderSilently();
    if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
    playing = false; closeMic();
    if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
    turns = []; renderCaptions();
    btn.textContent = 'Start'; btn.classList.remove('stop');
    setStatus('Stopped.');
  }
};

$('listMics').onclick = async function(){
  try {
    var tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
    var inputs = await listInputs(); tmp.getTracks().forEach(function(t){ t.stop(); });
    $('diag').textContent = inputs.map(function(d, i){ return (i + 1) + '. ' + (d.label || '(no name)') + '  [' + d.deviceId.slice(0, 8) + ']'; }).join('\n') || 'No microphones found.';
  } catch(e) { $('diag').textContent = 'Error: ' + e.message; }
};

paintChoices(); showKeyState();
</script>
</body>
</html>
